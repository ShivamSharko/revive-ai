services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: revive_ai, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    ports: ["5433:5432"]    # was "5432:5432"
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    
volumes: {pgdata: null}